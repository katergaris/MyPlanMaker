<!doctype html><html lang="it"><head><meta charset="utf-8"><title>MyPlanMaker — prova dell'interfaccia</title></head>
<body style="margin:0"><iframe id="f" src="index.html" style="border:0;width:1280px;height:800px"></iframe>
<script>
// Pilota l'app per le prove con chromium headless. Passi nell'hash, separati da virgole:
// esempio:N  sel:Nome  cmd:comando  tocca:Nome  vista:nome  distinta  schema  progetti
const f = document.getElementById('f');
const attendi = ms => new Promise(r => setTimeout(r, ms));
f.onload = async () => {
  let w; for (let i = 0; i < 100 && !(w = f.contentWindow).mpm; i++) await attendi(50);
  const { stato, tocco, comando } = w.mpm, d = w.document;
  const pezzo = nome => stato.progetto.pezzi.find(x => x.nome === decodeURIComponent(nome)).id;
  for (const p of location.hash.slice(1).split(',')) {
    if (p.startsWith('esempio:')) { d.getElementById('apri-progetti').click(); await attendi(300); d.querySelector(`[data-esempio="${p.slice(8)}"]`).click(); }
    if (p.startsWith('sel:')) tocco(pezzo(p.slice(4)));
    if (p.startsWith('tocca:')) tocco(pezzo(p.slice(6)), null);
    if (p.startsWith('cmd:')) comando(p.slice(4));
    if (p.startsWith('vista:')) d.querySelector(`[data-vista="${p.slice(6)}"]`).click();
    if (p === 'distinta') d.getElementById('apri-distinta').click();
    if (p === 'schema') { d.getElementById('apri-distinta').click(); d.querySelector('[data-scheda="schema"]').click(); }
    if (p === 'progetti') d.getElementById('apri-progetti').click();
    await attendi(400);
  }
};
</script></body></html>
