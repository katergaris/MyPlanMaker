<!doctype html><html lang="it"><head><meta charset="utf-8"><title>MyPlanMaker — prova dell'interfaccia</title></head>
<body style="margin:0"><iframe id="f" src="index.html" style="border:0;width:100vw;height:100vh"></iframe>
<script>
localStorage.setItem('mpm:guida-vista', '1');
// Lingua: ?lingua=en (altrimenti italiano, anche se il browser headless è in inglese).
localStorage.setItem('mpm:lingua', new URLSearchParams(location.search).get('lingua') || 'it');
// Pilota l'app per le prove con chromium headless. Passi nell'hash, separati da virgole:
// esempio:N  sel:Nome  cmd:comando  tocca:Nome  vista:nome  distinta  schema  ferramenta  progetti
// tracciaSu:selettore:x0:y0:x1:y1 (trascina col mouse sull'elemento, in pixel dal suo angolo)  trascina:Nome:dx:dy[:ox:oy] (mouse dal centro del pezzo, in pixel)  maniglia:i:dx:dy  quota:asse:valore  blocca:Nome  sposta:Nome:dx:dy:dz  stato  faccia:Nome:nx:ny:nz (tocca il centro della faccia del pezzo che guarda in quella direzione)  unita:cm
const f = document.getElementById('f');
const attendi = ms => new Promise(r => setTimeout(r, ms));
f.onload = async () => {
  let w; for (let i = 0; i < 100 && !(w = f.contentWindow).mpm; i++) await attendi(50);
  const { stato, tocco, comando } = w.mpm, d = w.document;
  const pezzo = nome => stato.progetto.pezzi.find(x => x.nome === decodeURIComponent(nome)).id;
  for (const p of location.hash.slice(1).split(',')) {
    if (p.startsWith('esempio:')) { d.getElementById('apri-progetti').click(); await attendi(300); d.querySelector(`[data-esempio="${p.slice(8)}"]`).click(); }
    if (p.startsWith('sel:')) tocco(pezzo(p.slice(4)));
    if (p.startsWith('tocca:')) tocco(pezzo(p.slice(6)), null);
    if (p.startsWith('faccia:')) {
      const [nome, ...n] = p.slice(7).split(':'), { Vector3 } = await import('./vendor/three.module.js'), mod = await import('./js/modello.js');
      const pz = stato.progetto.pezzi.find(x => x.nome === decodeURIComponent(nome)), b = mod.ingombro(pz), v = new Vector3(...n.map(Number));
      const punto = b.min.clone().add(b.max).multiplyScalar(0.5);
      for (const k of ['x', 'y', 'z']) if (v[k]) punto[k] = v[k] > 0 ? b.max[k] : b.min[k];
      tocco(pz.id, { normale: v, punto, spigolo: null });
    }
    if (p.startsWith('trascina:')) {
      const [nome, dx, dy, ox = 0, oy = 0] = p.slice(9).split(':'), mod = await import('./js/modello.js'), { vista } = w.mpm;
      const pz = stato.progetto.pezzi.find(x => x.nome === decodeURIComponent(nome)), b = mod.ingombro(pz);
      let [x, y] = vista.proietta(b.min.clone().add(b.max).multiplyScalar(0.5)), r = vista.renderer.domElement.getBoundingClientRect();
      x += +ox; y += +oy; // (facoltativo) punto di presa spostato dal centro, per esempio per evitare la freccia
      const ev = (tipo, px, py) => vista.renderer.domElement.dispatchEvent(new w.PointerEvent(tipo, { bubbles: true, cancelable: true, clientX: r.left + px, clientY: r.top + py, pointerId: 1, pointerType: 'mouse', isPrimary: true, button: 0, buttons: 1 }));
      ev('pointerdown', x, y);
      for (let i = 1; i <= 10; i++) { ev('pointermove', x + dx * i / 10, y + dy * i / 10); await attendi(20); }
      ev('pointerup', x + +dx, y + +dy);
    }
    if (p.startsWith('maniglia:')) {
      // maniglia:i:dx:dy — trascina la maniglia numero i del pezzo selezionato (in pixel)
      const [i, dx, dy] = p.slice(9).split(':').map(Number), { vista } = w.mpm, h = vista.maniglie.children[i];
      const [x, y] = vista.proietta(h.position), el = vista.el, r = vista.renderer.domElement.getBoundingClientRect();
      const ev = (tipo, px, py, dove = vista.renderer.domElement) => dove.dispatchEvent(new w.PointerEvent(tipo, { bubbles: true, cancelable: true, clientX: r.left + px, clientY: r.top + py, pointerId: 3, pointerType: 'mouse', isPrimary: true, button: 0, buttons: 1 }));
      ev('pointerdown', x, y, el.querySelector('canvas'));
      for (let k = 1; k <= 10; k++) { ev('pointermove', x + dx * k / 10, y + dy * k / 10); await attendi(20); }
      ev('pointerup', x + dx, y + dy);
    }
    if (p.startsWith('quota:')) {
      // quota:asse:valore — tocca la quota del pezzo selezionato e scrive la misura
      const [asse, v] = p.slice(6).split(':'), q = d.querySelector(`[data-asse="${asse}"]`);
      q.click(); await attendi(100);
      const inp = d.querySelector('.editor-quota input'); inp.value = v; inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter' }));
    }
    if (p.startsWith('tracciaSu:')) {
      const [sel, x0, y0, x1, y1] = decodeURIComponent(p.slice(10)).split(':'), el = d.querySelector(sel), r = el.getBoundingClientRect();
      const ev = (tipo, x, y) => el.dispatchEvent(new w.PointerEvent(tipo, { bubbles: true, cancelable: true, clientX: r.left + x, clientY: r.top + y, pointerId: 2, pointerType: 'mouse', isPrimary: true, button: 0, buttons: 1 }));
      ev('pointerdown', +x0, +y0);
      for (let i = 1; i <= 8; i++) { ev('pointermove', +x0 + (x1 - x0) * i / 8, +y0 + (y1 - y0) * i / 8); await attendi(15); }
      ev('pointerup', +x1, +y1);
    }
    if (p.startsWith('unita:')) d.querySelector(`[data-unita="${p.slice(6)}"]`).click();
    if (p.startsWith('cmd:')) comando(p.slice(4));
    if (p.startsWith('vista:')) d.querySelector(`[data-vista="${p.slice(6)}"]`).click();
    if (p === 'distinta') d.getElementById('apri-distinta').click();
    if (p === 'schema') { d.getElementById('apri-distinta').click(); d.querySelector('[data-scheda="schema"]').click(); }
    if (p === 'ferramenta') { d.getElementById('apri-distinta').click(); d.querySelector('[data-scheda="ferramenta"]').click(); }
    if (p.startsWith('modello:')) { comando('modelli'); await attendi(200); d.querySelector(`[data-modello="${p.slice(8)}"]`).click(); }
    if (p === 'crea') d.querySelector('[data-crea="nuovo"]').click();
    if (p.startsWith('fissaggio:')) { stato.progetto.fissaggioPredefinito = p.slice(10); w.mpm.apri(stato.progetto); }
    if (p.startsWith('clic:')) d.querySelector(decodeURIComponent(p.slice(5)))?.click();
    if (p === 'disegni') { d.getElementById('apri-distinta').click(); d.querySelector('[data-scheda="disegni"]').click(); }
    if (p.startsWith('menu:')) w.mpm.menuAltro(p.slice(5));
    if (p === 'progetti') d.getElementById('apri-progetti').click();
    if (p.startsWith('blocca:')) { tocco(pezzo(p.slice(7))); comando('blocca'); }
    if (p.startsWith('sposta:')) { const [nome, ...d] = p.slice(7).split(':'), pz = stato.progetto.pezzi.find(x => x.nome === decodeURIComponent(nome)); w.mpm.mod.sposta(pz, d.map(Number)); w.mpm.apri(stato.progetto); tocco(pz.id); }
    if (p === 'stato') document.body.insertAdjacentHTML('beforeend', `<pre id="stato">${JSON.stringify({ pezzi: stato.progetto.pezzi.map(x => ({ nome: x.nome, pos: x.pos, L: x.L, W: x.W, tagli: x.tagli.length, intagli: x.intagli?.length, lav: x.lavorazioni?.length, blocc: x.bloccato })), accostato: stato.accostato, toast: d.getElementById('toast-testo').textContent })}</pre>`);
    if (p === 'mancanti') document.body.insertAdjacentHTML('beforeend', `<pre id="mancanti">${JSON.stringify([...w.mpm.lingua.mancanti])}</pre>`);
    await attendi(400);
  }
};
</script></body></html>
