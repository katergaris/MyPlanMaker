<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>MyPlanMaker — prove</title>
<style>body{font:14px system-ui;padding:20px} .ok{color:#2f7d4f} .ko{color:#c0392b;font-weight:600}</style></head>
<body><h1>Prove del modello</h1><ul id="esiti"></ul><pre id="riassunto">in corso…</pre>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import { avviaGeometria, geometriaPezzo } from './js/geometria.js';
import * as mod from './js/modello.js';
import { mobilettoLeggio, tavoloRotondo } from './js/esempi.js';
import { righeDistinta } from './js/distinta.js';
import { schemaDiTaglio } from './js/taglio.js';
import { daFile, versoFile } from './js/archivio.js';

const esiti = [];
const vicino = (a, b, tol = 0.6) => Math.abs(a - b) <= tol;
function prova(nome, cond, dettaglio = '') { esiti.push({ nome, ok: !!cond, dettaglio }); }

await avviaGeometria();

// 1. Mobiletto: fianchi e schienale adattati al piano inclinato di 16,7°
{
  const pr = mobilettoLeggio(), righe = righeDistinta(pr), r = n => righe.find(x => x.nome === n);
  const f = r('Fianco sinistro'), s = r('Schienale');
  prova('fianco: misura finita 900 × 500', vicino(f.L, 900, 1) && vicino(f.W, 500, 1), `${f.L} × ${f.W}`);
  prova('fianco: testa obliqua 16,7°', f.tagli[0] === 'Testa B: obliquo 16,7°', f.tagli.join('; '));
  prova('schienale: lama inclinata 16,7°', s.tagli[0] === 'Testa B: lama inclinata 16,7°', s.tagli.join('; '));
  prova('schienale: lunghezza finita ~850', vicino(s.L, 850, 1.5), `${s.L}`);
  prova('nessun pezzo vuoto', righe.every(x => !x.vuoto));
}

// 2. Adatta allunga: un listello corto sotto un ripiano arriva fino al ripiano con taglio a squadra
{
  const pr = mod.nuovoProgetto();
  const gamba = mod.nuovoPezzo(pr, 'listello'); gamba.L = 300; gamba.pos = [100, 0, 0];
  const piano = mod.nuovoPezzo(pr, 'pannello'); piano.pos = [0, 700, 100];
  const r = mod.adatta(gamba, piano), g = geometriaPezzo(gamba);
  prova('adatta allunga fino a 700', r.ok && vicino(g.max[0] - g.min[0], 700), `${r.msg} · L=${g.max[0] - g.min[0]}`);
  prova('taglio a squadra', r.msg === 'Testa B: a squadra', r.msg);
}

// 3. Adatta su un piano inclinato di 30° di lato (taglio obliquo + direzione corretta)
{
  const pr = mod.nuovoProgetto();
  const gamba = mod.nuovoPezzo(pr, 'listello'); gamba.L = 1200; gamba.pos = [400, 0, 0];
  const piano = mod.nuovoPezzo(pr, 'pannello'); piano.L = 1200; piano.pos = [0, 600, 200]; piano.rot = [-90, 0, 30];
  const r = mod.adatta(gamba, piano), g = geometriaPezzo(gamba);
  prova('taglio obliquo di 30°', r.ok && /30°/.test(r.msg), r.msg);
  prova('la gamba resta sotto il piano', g && g.max[0] < 1200, g && `${g.max[0]}`);
}

// 4. Paralleli: Adatta rifiuta
{
  const pr = mod.nuovoProgetto();
  const a = mod.nuovoPezzo(pr, 'pannello'), b = mod.nuovoPezzo(pr, 'pannello'); b.pos = [0, 300, 0];
  prova('pezzi paralleli: Adatta dice di usare Accosta', !mod.adatta(a, b).ok);
}

// 5. Accosta: un pannello appoggiato sopra un altro
{
  const pr = mod.nuovoProgetto();
  const a = mod.nuovoPezzo(pr, 'pannello'), b = mod.nuovoPezzo(pr, 'pannello'); b.pos = [0, 300, 0];
  const { Vector3 } = await import('./vendor/three.module.js');
  mod.accosta(b, { normale: new Vector3(0, 1, 0), punto: new Vector3(0, 18, 0) });
  prova('accosta: appoggiato a 18 mm', vicino(b.pos[1], 18, 0.01), `${b.pos[1]}`);
}

// 6. Tavolo rotondo
{
  const pr = tavoloRotondo(), righe = righeDistinta(pr), p = righe.find(x => x.nome === 'Piano rotondo');
  prova('piano rotondo Ø 1000', vicino(p.L, 1000, 1) && /^rotondo Ø 1\.?000$/.test(p.forma[0]), `${p.L} · ${p.forma}`);
  prova('tavolo: 9 pezzi', righe.length === 9);
}

// 7. Schema di taglio
function controllaLastre(gruppi, lama) {
  for (const g of gruppi) for (const f of g.fogli) {
    if (!f.H) continue;
    for (const [i, a] of f.pezzi.entries()) {
      if (a.x < 0 || a.y < 0 || a.x + a.w > f.L + 1e-6 || a.y + a.h > f.H + 1e-6) return `n° ${a.n} esce dalla lastra`;
      for (const b of f.pezzi.slice(i + 1)) {
        const staccati = a.x + a.w + lama <= b.x + 1e-6 || b.x + b.w + lama <= a.x + 1e-6 || a.y + a.h + lama <= b.y + 1e-6 || b.y + b.h + lama <= a.y + 1e-6;
        if (!staccati) return `n° ${a.n} e n° ${b.n} si sovrappongono (o manca la lama)`;
      }
    }
  }
  return '';
}
{
  const pr = mobilettoLeggio(), g = schemaDiTaglio(pr);
  const posati = g.reduce((s, x) => s + x.fogli.reduce((t, f) => t + f.pezzi.length, 0), 0);
  prova('mobiletto: tutti i 7 pezzi sulle lastre', posati === 7 && g.every(x => !x.fuori.length), `${posati}`);
  const err = controllaLastre(g, 3.2);
  prova('mobiletto: nessuna sovrapposizione, lama rispettata', !err, err);
  prova('multistrato: venatura rispettata (nessun pezzo ruotato)', g.find(x => x.materiale.id === 'mb18').fogli.every(f => f.pezzi.every(p => !p.ruotato)));
}
{
  const pr = tavoloRotondo(), g = schemaDiTaglio(pr), gambe = g.find(x => x.materiale.id === 'ro6060');
  prova('tavolo: 4 gambe da 723 in 2 barre da 2500', gambe.fogli.length === 2, `${gambe.fogli.length}`);
  const piano = g.find(x => x.materiale.id === 'ro27');
  prova('tavolo: il piano Ø 1000 entra in una lastra 2500×1200', piano.fuori.length === 0 && piano.fogli.length === 1, `${piano.fuori.length}`);
  const pr2 = tavoloRotondo(); pr2.pezzi[0].D = 1400;
  prova('piano Ø 1400 troppo grande: viene segnalato', schemaDiTaglio(pr2).find(x => x.materiale.id === 'ro27').fuori.length === 1);
}
{
  const pr = mod.nuovoProgetto();
  for (let i = 0; i < 30; i++) { const p = mod.nuovoPezzo(pr, 'pannello'); p.mat = 'tn18'; p.L = 300 + (i * 97) % 700; p.W = 200 + (i * 53) % 400; }
  const g = schemaDiTaglio(pr), err = controllaLastre(g, 3.2);
  const posati = g[0].fogli.reduce((t, f) => t + f.pezzi.length, 0);
  prova('30 pezzi misti: tutti posati senza sovrapposizioni', posati === 30 && !err, `${posati} ${err} · ${g[0].fogli.length} lastre`);
}

// 8. File di progetto
{
  const pr = mobilettoLeggio(); pr.id = 'x';
  const p2 = daFile(versoFile(pr));
  prova('esporta → importa: stessi pezzi e tagli', JSON.stringify(p2.pezzi) === JSON.stringify(pr.pezzi));
  let errore = '';
  try { daFile('{"ciao": 1}'); } catch (e) { errore = e.message; }
  prova('file sbagliato: messaggio chiaro', /non contiene/.test(errore), errore);
}

document.getElementById('esiti').innerHTML = esiti.map(e => `<li class="${e.ok ? 'ok' : 'ko'}">${e.ok ? '✓' : '✗'} ${e.nome} <small>${e.dettaglio}</small></li>`).join('');
const ko = esiti.filter(e => !e.ok).length;
document.getElementById('riassunto').textContent = ko ? `FALLITE ${ko} su ${esiti.length}` : `TUTTE OK (${esiti.length})`;
</script></body></html>
