<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>MyPlanMaker — prove</title>
<style>body{font:14px system-ui;padding:20px} .ok{color:#2f7d4f} .ko{color:#c0392b;font-weight:600}</style></head>
<body><h1>Prove del modello</h1><ul id="esiti"></ul><pre id="riassunto">in corso…</pre>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module">
import { avviaGeometria, geometriaPezzo } from './js/geometria.js';
import * as mod from './js/modello.js';
import { mobilettoLeggio, tavoloRotondo } from './js/esempi.js';
import { righeDistinta } from './js/distinta.js';
import { schemaDiTaglio } from './js/taglio.js';
import { daFile, versoFile } from './js/archivio.js';
import { unioni } from './js/unioni.js';
import { cerniere, maniglia } from './js/ferramenta.js';
import { controlli, freccia } from './js/controlli.js';
import { MODELLI, valoriDefault } from './js/modelli.js';
import { listaSpesa } from './js/spesa.js';
import { normalizza, FORME } from './js/sagome.js';
import { foriDelPezzo, htmlDima, htmlDisegno, htmlEtichette } from './js/disegni.js';
import { contornoSagoma, puntiArco } from './js/geometria.js';

const esiti = [];
const vicino = (a, b, tol = 0.6) => Math.abs(a - b) <= tol;
function prova(nome, cond, dettaglio = '') { esiti.push({ nome, ok: !!cond, dettaglio }); }

await avviaGeometria();

// 1. Mobiletto: fianchi e schienale adattati al piano inclinato di 16,7°
{
  const pr = mobilettoLeggio(), righe = righeDistinta(pr), r = n => righe.find(x => x.nome === n);
  const f = r('Fianco sinistro'), s = r('Schienale');
  prova('fianco: misura finita 900 × 500', vicino(f.L, 900, 1) && vicino(f.W, 500, 1), `${f.L} × ${f.W}`);
  prova('fianco: testa obliqua 16,7°', f.tagli[0] === 'Testa B: obliquo 16,7°', f.tagli.join('; '));
  prova('schienale: lama inclinata 16,7°', s.tagli[0] === 'Testa B: lama inclinata 16,7°', s.tagli.join('; '));
  prova('schienale: lunghezza finita ~850', vicino(s.L, 850, 1.5), `${s.L}`);
  prova('nessun pezzo vuoto', righe.every(x => !x.vuoto));
}

// 2. Adatta allunga: un listello corto sotto un ripiano arriva fino al ripiano con taglio a squadra
{
  const pr = mod.nuovoProgetto();
  const gamba = mod.nuovoPezzo(pr, 'listello'); gamba.L = 300; gamba.pos = [100, 0, 0];
  const piano = mod.nuovoPezzo(pr, 'pannello'); piano.pos = [0, 700, 100];
  const r = mod.adatta(gamba, piano), g = geometriaPezzo(gamba);
  prova('adatta allunga fino a 700', r.ok && vicino(g.max[0] - g.min[0], 700), `${r.msg} · L=${g.max[0] - g.min[0]}`);
  prova('taglio a squadra', r.msg === 'Testa B: a squadra', r.msg);
}

// 3. Adatta su un piano inclinato di 30° di lato (taglio obliquo + direzione corretta)
{
  const pr = mod.nuovoProgetto();
  const gamba = mod.nuovoPezzo(pr, 'listello'); gamba.L = 1200; gamba.pos = [400, 0, 0];
  const piano = mod.nuovoPezzo(pr, 'pannello'); piano.L = 1200; piano.pos = [0, 600, 200]; piano.rot = [-90, 0, 30];
  const r = mod.adatta(gamba, piano), g = geometriaPezzo(gamba);
  prova('taglio obliquo di 30°', r.ok && /30°/.test(r.msg), r.msg);
  prova('la gamba resta sotto il piano', g && g.max[0] < 1200, g && `${g.max[0]}`);
}

// 4. Paralleli: Adatta rifiuta
{
  const pr = mod.nuovoProgetto();
  const a = mod.nuovoPezzo(pr, 'pannello'), b = mod.nuovoPezzo(pr, 'pannello'); b.pos = [0, 300, 0];
  prova('pezzi paralleli: Adatta dice di usare Accosta', !mod.adatta(a, b).ok);
}

// 5. Accosta: un pannello appoggiato sopra un altro
{
  const pr = mod.nuovoProgetto();
  const a = mod.nuovoPezzo(pr, 'pannello'), b = mod.nuovoPezzo(pr, 'pannello'); b.pos = [0, 300, 0];
  const { Vector3 } = await import('./vendor/three.module.js');
  mod.accosta(b, { normale: new Vector3(0, 1, 0), punto: new Vector3(0, 18, 0) });
  prova('accosta: appoggiato a 18 mm', vicino(b.pos[1], 18, 0.01), `${b.pos[1]}`);
}

// 6. Tavolo rotondo
{
  const pr = tavoloRotondo(), righe = righeDistinta(pr), p = righe.find(x => x.nome === 'Piano rotondo');
  prova('piano rotondo Ø 1000', vicino(p.L, 1000, 1) && /^rotondo Ø 1\.?000$/.test(p.forma[0]), `${p.L} · ${p.forma}`);
  prova('tavolo: 9 pezzi', righe.length === 9);
}

// 7. Schema di taglio
function controllaLastre(gruppi, lama) {
  for (const g of gruppi) for (const f of g.fogli) {
    if (!f.H) continue;
    for (const [i, a] of f.pezzi.entries()) {
      if (a.x < 0 || a.y < 0 || a.x + a.w > f.L + 1e-6 || a.y + a.h > f.H + 1e-6) return `n° ${a.n} esce dalla lastra`;
      for (const b of f.pezzi.slice(i + 1)) {
        const staccati = a.x + a.w + lama <= b.x + 1e-6 || b.x + b.w + lama <= a.x + 1e-6 || a.y + a.h + lama <= b.y + 1e-6 || b.y + b.h + lama <= a.y + 1e-6;
        if (!staccati) return `n° ${a.n} e n° ${b.n} si sovrappongono (o manca la lama)`;
      }
    }
  }
  return '';
}
{
  const pr = mobilettoLeggio(), g = schemaDiTaglio(pr);
  const posati = g.reduce((s, x) => s + x.fogli.reduce((t, f) => t + f.pezzi.length, 0), 0);
  prova('mobiletto: tutti i 7 pezzi sulle lastre', posati === 7 && g.every(x => !x.fuori.length), `${posati}`);
  const err = controllaLastre(g, 3.2);
  prova('mobiletto: nessuna sovrapposizione, lama rispettata', !err, err);
  prova('multistrato: venatura rispettata (nessun pezzo ruotato)', g.find(x => x.materiale.id === 'mb18').fogli.every(f => f.pezzi.every(p => !p.ruotato)));
}
{
  const pr = tavoloRotondo(), g = schemaDiTaglio(pr), gambe = g.find(x => x.materiale.id === 'ro6060');
  prova('tavolo: 4 gambe da 723 in 2 barre da 2500', gambe.fogli.length === 2, `${gambe.fogli.length}`);
  const piano = g.find(x => x.materiale.id === 'ro27');
  prova('tavolo: il piano Ø 1000 entra in una lastra 2500×1200', piano.fuori.length === 0 && piano.fogli.length === 1, `${piano.fuori.length}`);
  const pr2 = tavoloRotondo(); pr2.pezzi[0].D = 1400;
  prova('piano Ø 1400 troppo grande: viene segnalato', schemaDiTaglio(pr2).find(x => x.materiale.id === 'ro27').fuori.length === 1);
}
{
  const pr = mod.nuovoProgetto();
  for (let i = 0; i < 30; i++) { const p = mod.nuovoPezzo(pr, 'pannello'); p.mat = 'tn18'; p.L = 300 + (i * 97) % 700; p.W = 200 + (i * 53) % 400; }
  const g = schemaDiTaglio(pr), err = controllaLastre(g, 3.2);
  const posati = g[0].fogli.reduce((t, f) => t + f.pezzi.length, 0);
  prova('30 pezzi misti: tutti posati senza sovrapposizioni', posati === 30 && !err, `${posati} ${err} · ${g[0].fogli.length} lastre`);
}

// 8. File di progetto
{
  const pr = mobilettoLeggio(); pr.id = 'x';
  const p2 = daFile(versoFile(pr));
  prova('esporta → importa: stessi pezzi e tagli', JSON.stringify(p2.pezzi) === JSON.stringify(pr.pezzi));
  let errore = '';
  try { daFile('{"ciao": 1}'); } catch (e) { errore = e.message; }
  prova('file sbagliato: messaggio chiaro', /non contiene/.test(errore), errore);
}

// 9. Unioni e viti
{
  const pr = mobilettoLeggio(), u = unioni(pr);
  const trova = (x, y) => u.giunti.find(g => [g.a.nome, g.b.nome].sort().join('|') === [x, y].sort().join('|'));
  const g1 = trova('Fianco sinistro', 'Fondo');
  prova('fianco → fondo: 3 viti 4×40 dal fianco', g1 && g1.passa.nome === 'Fianco sinistro' && g1.viti.length === 3 && g1.vite.misura === '4×40', g1 && `${g1.tipo} · ${g1.viti.length} × ${g1.vite?.misura}`);
  const g2 = trova('Fianco destro', 'Ripiano');
  prova('fianco destro → ripiano: viti', g2 && g2.viti.length === 3, g2 && g2.tipo);
  const g3 = trova('Piano inclinato', 'Fianco sinistro');
  prova('piano inclinato sui fianchi: viti con avviso "in vista"', g3 && g3.viti.length >= 2 && g3.note.some(n => /in vista/.test(n)), g3 && `${g3.tipo} · ${g3.note.join(' ')}`);
  const g4 = trova('Schienale', 'Fianco sinistro');
  prova('schienale da 3 mm: chiodini, niente viti', g4 && g4.chiodini, g4 && g4.note.join(' '));
  const g5 = trova('Anta', 'Fondo');
  prova('anta con cerniere: niente viti', !g5 || g5.tipo === 'cerniere', g5 && g5.tipo);
  prova('nessuna collisione nel mobiletto', u.avvisi.length === 0, u.avvisi.join(' '));
  const v = g1.viti[0], lungo = v.testa.distanceTo(v.punta);
  prova('vite: parte fuori dal fianco e entra nel fondo', Math.abs(v.testa.x - 0) < 0.5 && Math.abs(v.punta.x - 40) < 0.5 && Math.abs(lungo - 40) < 0.5, `${v.testa.x.toFixed(1)} → ${v.punta.x.toFixed(1)}`);
  const anta = pr.pezzi.find(p => p.nome === 'Anta'), c = cerniere(anta), m = maniglia(anta);
  prova('anta 330 mm: 2 cerniere a 22,5 mm dal bordo', c.n === 2 && c.punti.every(p => Math.abs(p[0] - 22.5) < 0.01), JSON.stringify(c.punti));
  prova('maniglia dal lato opposto alle cerniere, interasse 128', m.lato === 'B' && Math.abs(m.fori[1].c[1] - m.fori[0].c[1] - 128) < 0.01 && !m.avvisi.length, JSON.stringify(m.fori.map(f => f.c)));
  const g = geometriaPezzo(anta);
  prova('scodelle e fori scavati nell\'anta', g.volume < 796 * 330 * 18 - 2 * Math.PI * 17.5 ** 2 * 12, `${Math.round(g.volume)}`);
}
{
  const pr = tavoloRotondo(), u = unioni(pr);
  const g = u.giunti.find(g => /Gamba 1/.test(g.a.nome + g.b.nome) && /Piano/.test(g.a.nome + g.b.nome));
  prova('tavolo: gamba sotto il piano → avviso viti in vista e massello', g && g.note.some(n => /in vista/.test(n)), g && `${g.tipo} · ${g.note.join(' ')}`);
  const f = u.giunti.find(g => /Fascia davanti/.test(g.a.nome + g.b.nome) && /Gamba/.test(g.a.nome + g.b.nome));
  prova('tavolo: fascia contro gamba trovata', !!f, f && `${f.tipo} · ${f.note.join(' ')}`);
}

// 10. Dividi
{
  const pr = mobilettoLeggio(), { Vector3 } = await import('./vendor/three.module.js');
  const vm = p => { const g = geometriaPezzo(p), m = mod.matrice(p); return g.vertici.map(v => new Vector3(...v).applyMatrix4(m)); };
  const fondo = pr.pezzi.find(p => p.nome === 'Fondo'), rip = pr.pezzi.find(p => p.nome === 'Ripiano');
  const s = mod.spazioTra(fondo, rip, vm(fondo), vm(rip), 2);
  prova('dividi fondo-ripiano: spazio 318, 2 pezzi, luce 94', s.ok && Math.abs(s.luce - 318) < 0.01 && Math.abs(s.passo - 94) < 0.01, s.msg || `${s.luce} ${s.passo}`);
  const nuovi = mod.dividi(pr, fondo, s, 2);
  prova('dividi: ripiani a 68+94 e 68+94+18+94', Math.abs(nuovi[0].pos[1] - 162) < 0.01 && Math.abs(nuovi[1].pos[1] - 274) < 0.01, nuovi.map(p => p.pos[1]).join(', '));
  const u = unioni(pr), g = u.giunti.filter(g => nuovi.includes(g.a) || nuovi.includes(g.b));
  prova('dividi: i nuovi pezzi prendono le viti dai fianchi', g.filter(x => x.viti.length === 3).length === 4, `${g.length}`);
  const fs = pr.pezzi.find(p => p.nome === 'Fianco sinistro'), piano = pr.pezzi.find(p => p.nome === 'Piano inclinato');
  prova('dividi tra pezzi non paralleli: rifiuta', !mod.spazioTra(fs, piano, vm(fs), vm(piano), 1).ok);
}

// 11. Controlli
{
  const pr = mobilettoLeggio(), c = controlli(pr);
  const r = c.frecce.find(f => f.p.nome === 'Ripiano');
  prova('freccia del ripiano 764×490×18 multistrato con 30 kg/m: ~0,6 mm subito', r && Math.abs(r.subito - 0.61) < 0.05 && r.giudizio === 'ottimo', r && `${r.subito.toFixed(2)} / ${r.nelTempo.toFixed(2)} ${r.giudizio}`);
  prova('mobiletto: peso plausibile (25-40 kg) e stabile', c.peso > 25 && c.peso < 40 && !c.avvisi.length, `${c.peso.toFixed(1)} kg · ${c.avvisi.join(' ')}`);
  const lungo = mod.nuovoProgetto(); const p = mod.nuovoPezzo(lungo, 'pannello'); p.mat = 'tn18'; p.L = 1200; p.W = 300;
  const f = freccia(p, 40);
  prova('ripiano truciolare 1200×300 con 40 kg/m: troppo', f.giudizio === 'troppo', `${f.nelTempo.toFixed(1)} mm`);
}
{
  const pr = tavoloRotondo(), c = controlli(pr);
  prova('tavolo a 4 gambe: stabile con 25 kg sul bordo', !c.avvisi.length, c.avvisi.join(' ') + c.note.join(' '));
  for (const g of pr.pezzi.filter(p => p.nome.startsWith('Gamba'))) { g.pos[0] = 500 + (g.pos[0] - 500) * 0.25; g.pos[2] = -500 + (g.pos[2] + 500) * 0.25; }
  pr.pezzi = pr.pezzi.filter(p => !p.nome.startsWith('Fascia'));
  const c2 = controlli(pr);
  prova('gambe strette al centro: si ribalta appoggiandosi', c2.avvisi.some(a => /ribalta/.test(a)), c2.avvisi.join(' '));
}

// 12. Gizmo, calamita, copia specchiata
{
  const T = await import('./vendor/three.module.js');
  const pr = mod.nuovoProgetto(), a = mod.nuovoPezzo(pr, 'pannello'); a.pos = [0, 0, 0];
  mod.trasforma(a, new T.Matrix4().makeTranslation(100, 50, -20));
  prova('sposta col gizmo: +100, +50, -20', a.pos.join() === '100,50,-20', a.pos.join());
  const b = mod.nuovoPezzo(pr, 'pannello'); b.pos = [0, 0, 0]; b.rot = [-90, 0, 0];
  mod.trasforma(b, new T.Matrix4().makeRotationY(Math.PI / 2));
  const asseL = new T.Vector3(1, 0, 0).applyMatrix4(new T.Matrix4().extractRotation(mod.matrice(b)));
  prova('ruota di 90° in pianta: la lunghezza va verso -Z', Math.abs(asseL.z + 1) < 1e-6, `${asseL.toArray().map(v => v.toFixed(3))} rot ${b.rot}`);
  const pr2 = mod.nuovoProgetto(), x = mod.nuovoPezzo(pr2, 'pannello'), y = mod.nuovoPezzo(pr2, 'pannello');
  x.pos = [0, 0, 0]; y.pos = [0, 26, 0];
  const s = mod.calamita(pr2, new Set([y.id]), p => mod.ingombro(p));
  prova('calamita: a 8 mm si appoggia sopra', Math.abs(y.pos[1] - 18) < 0.01, `${s} → ${y.pos}`);
  const pr3 = mobilettoLeggio(), fs = pr3.pezzi.find(p => p.nome === 'Fianco sinistro'), an = pr3.pezzi.find(p => p.nome === 'Anta');
  const [c1, c2] = mod.copiaSpecchiata(pr3, [fs, an], 800);
  const g1 = geometriaPezzo(c1), b1 = mod.ingombro(c1, g1.vertici.map(v => new T.Vector3(...v).applyMatrix4(mod.matrice(c1))));
  prova('copia specchiata del fianco: da x 1582 a 1600, stessa misura finita', Math.abs(b1.min.x - 1582) < 0.01 && Math.abs(b1.max.x - 1600) < 0.01 && Math.abs(g1.max[0] - g1.min[0] - 900) < 0.6, `${b1.min.x.toFixed(1)}..${b1.max.x.toFixed(1)} L ${(g1.max[0] - g1.min[0]).toFixed(1)}`);
  const piano = pr3.pezzi.find(p => p.nome === 'Piano inclinato'), gp = geometriaPezzo(piano);
  const topFianco = Math.max(...g1.vertici.map(v => new T.Vector3(...v).applyMatrix4(mod.matrice(c1)).y));
  prova('copia specchiata: il taglio obliquo resta in cima (900 dietro)', Math.abs(topFianco - 900) < 0.6, `${topFianco.toFixed(1)}`);
  prova('copia specchiata dell\'anta: cerniere sul lato B', cerniere(c2).lato === 'B', cerniere(c2).lato);
}

// 13. Modelli pronti e cassetti
for (const m of MODELLI) {
  const pr = mod.nuovoProgetto(m.nome);
  let errore = '';
  try { m.crea(pr, valoriDefault(m), 0); } catch (e) { errore = e.message; }
  const righe = righeDistinta(pr), c = controlli(pr), u = unioni(pr);
  const vuoti = righe.filter(r => r.vuoto).length;
  const conViti = u.giunti.filter(g => g.viti.length).length;
  prova(`modello «${m.nome}»: ${pr.pezzi.length} pezzi, nessun errore, nessuna compenetrazione`, !errore && pr.pezzi.length >= 3 && !vuoti && !c.avvisi.some(a => /compenetrano/.test(a)) && !u.avvisi.length,
    `${errore} ${vuoti} vuoti · ${c.avvisi.join(' ')} ${u.avvisi.join(' ')} · ${conViti} unioni con viti · ${c.peso.toFixed(1)} kg`);
}
{
  const m = MODELLI.find(x => x.id === 'cassettiera'), pr = mod.nuovoProgetto();
  m.crea(pr, valoriDefault(m), 0);
  const fr = pr.pezzi.filter(p => /frontale/.test(p.nome)), sp = listaSpesa(pr, unioni(pr));
  prova('cassettiera: 4 frontali e 4 coppie di guide da 400 (450 meno il frontale a filo)', fr.length === 4 && sp.righe.some(r => /guide.*400/.test(r.voce) && r.qta === 4), sp.righe.map(r => `${r.qta}× ${r.voce}`).join('; '));
  const u = unioni(pr), mobili = u.giunti.filter(g => g.tipo === 'parte mobile');
  prova('cassetti: nessuna vite tra cassetto e mobile', u.giunti.every(g => !(g.a.mobile ^ g.b.mobile) || g.tipo === 'parte mobile' || !g.viti.length), `${mobili.length} contatti mobili`);
  const interne = u.giunti.filter(g => g.a.gruppo && g.a.gruppo === g.b.gruppo && g.viti.length);
  prova('cassetto: fianchi avvitati a fronte e retro, frontale avvitato da dentro', interne.length >= 4 * 3, `${interne.length} unioni avvitate nei cassetti · ${interne.slice(0, 3).map(g => g.vite.misura).join(', ')}`);
}
{
  const pr = mobilettoLeggio(), a = pr.pezzi[0], b = mod.duplica(pr, a);
  b.pos = [...a.pos]; b.pos[0] -= 5;
  prova('due fianchi uno dentro l\'altro: «si compenetrano»', controlli(pr).avvisi.some(x => /compenetrano/.test(x)));
}

// 14. Fissaggi, bordi, venatura
{
  const pr = mobilettoLeggio(), fs = pr.pezzi.find(p => p.nome === 'Fianco sinistro'), fondo = pr.pezzi.find(p => p.nome === 'Fondo');
  const k = [fs.id, fondo.id].sort().join('|');
  for (const [tipo, atteso] of [['confirmat', /confirmat 7×50/], ['spinotti', /spinotti Ø 8/], ['eccentrici', /eccentrici Ø 15/], ['colla', /solo colla/]]) {
    pr.fissaggi = { [k]: tipo };
    const g = unioni(pr).giunti.find(x => x.chiave === k);
    prova(`fianco → fondo con ${tipo}`, atteso.test((await import('./js/unioni.js')).descriviGiunto(g)), (await import('./js/unioni.js')).descriviGiunto(g));
  }
  pr.fissaggi = { [k]: 'spinotti' };
  const sp = listaSpesa(pr, unioni(pr));
  prova('spinotti nella lista della spesa con la colla', sp.righe.some(r => /Spinotto/.test(r.voce)) && sp.righe.some(r => /Colla/.test(r.voce)));
  const rip = pr.pezzi.find(p => p.nome === 'Ripiano');
  prova('nomi dei bordi del ripiano: davanti = bordo basso', mod.nomeBordo(rip, 'basso') === 'davanti' && mod.nomeBordo(rip, 'alto') === 'dietro', `${mod.nomeBordo(rip, 'basso')} / ${mod.nomeBordo(rip, 'alto')}`);
  rip.bordatura = { spessore: 2, lati: ['basso'] };
  const r = righeDistinta(pr).find(x => x.nome === 'Ripiano');
  prova('ripiano bordato 2 mm davanti: da tagliare 764 × 488', r.Ltaglio === 764 && r.Wtaglio === 488, `${r.Ltaglio} × ${r.Wtaglio}`);
  rip.venatura = 'W';
  const g = schemaDiTaglio(pr).find(x => x.materiale.id === 'mb18'), posto = g.fogli.flatMap(f => f.pezzi).find(p => p.n === rip.n);
  prova('venatura in larghezza: il ripiano va ruotato sulla lastra', posto.ruotato && Math.abs(posto.w - 488) < 0.01, `${posto.w}×${posto.h} ruotato=${posto.ruotato}`);
  prova('schema senza sovrapposizioni con bordi e venatura', !controllaLastre(schemaDiTaglio(pr), 3.2));
}

// 15. Sagome, disegni, dime, etichette
{
  const arco = puntiArco([0, 0], [100, 0], 20), ymin = Math.min(...arco.map(q => q[1]));
  prova('arco di freccia 20 su corda 100: sporge di 20 verso l\'esterno (a destra)', Math.abs(ymin + 20) < 0.3, ymin.toFixed(2));
  const orario = [{ x: 0, y: 0 }, { x: 0, y: 300 }, { x: 500, y: 300 }, { x: 500, y: 0 }];
  const n = normalizza(orario);
  const area = n.punti.reduce((t, q, i) => { const r = n.punti[(i + 1) % n.punti.length]; return t + q.x * r.y - r.x * q.y; }, 0);
  prova('sagoma disegnata in senso orario: girata in antiorario', area > 0 && n.L === 500 && n.W === 300, `${area} ${n.L}×${n.W}`);
  const ar = normalizza(FORME.arco(800, 400));
  prova('forma «arco sopra» 800×400: ingombro 800 × 400', Math.abs(ar.L - 800) < 0.2 && Math.abs(ar.W - 400) < 0.5, `${ar.L}×${ar.W}`);
  const pr = mobilettoLeggio(), fs = pr.pezzi.find(p => p.nome === 'Fianco sinistro');
  Object.assign(fs, { forma: 'sagoma', sagoma: ar.punti, L: ar.L, W: ar.W, tagli: [] });
  const g = geometriaPezzo(fs);
  prova('pezzo sagomato: solido valido con l\'area giusta', g && Math.abs(g.volume / 18 - (800 * 300 + (2 / 3) * 800 * 100)) / g.volume * 18 < 0.02, g && `${Math.round(g.volume / 18)} mm²`);
  const anta = pr.pezzi.find(p => p.nome === 'Anta'), fori = foriDelPezzo(pr, anta);
  prova('fori dell\'anta: 2 scodelle Ø 35 e 2 fori maniglia', fori.filter(f => f.d === 35).length === 2 && fori.filter(f => f.d === 5).length === 2, fori.map(f => `${f.nome} Ø${f.d}`).join(', '));
  const fondo = pr.pezzi.find(p => p.nome === 'Fondo'), ff = foriDelPezzo(pr, fondo);
  prova('fori del fondo: 6 fori nel bordo per le viti dai fianchi', ff.filter(f => f.faccia === 'bordo').length === 6, `${ff.length}`);
  prova('disegno del fondo con tabella fori', /Foro nel bordo/.test(htmlDisegno(pr, fondo)));
  const tav = tavoloRotondo(), dima = htmlDima(tav, tav.pezzi[0]);
  prova('dima 1:1 del piano Ø 1000: 24 fogli A4', (dima.match(/class="foglio-dima"/g) || []).length === 24, `${(dima.match(/class="foglio-dima"/g) || []).length}`);
  const et = htmlEtichette(pr, righeDistinta(pr));
  prova('etichette: una per pezzo', (et.match(/class="etichetta"/g) || []).length === pr.pezzi.length);
}

document.getElementById('esiti').innerHTML = esiti.map(e => `<li class="${e.ok ? 'ok' : 'ko'}">${e.ok ? '✓' : '✗'} ${e.nome} <small>${e.dettaglio}</small></li>`).join('');
const ko = esiti.filter(e => !e.ok).length;
document.getElementById('riassunto').textContent = ko ? `FALLITE ${ko} su ${esiti.length}` : `TUTTE OK (${esiti.length})`;
</script></body></html>
