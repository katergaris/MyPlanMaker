<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdfa">
<title>MyPlanMaker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="stylesheet" href="stile.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">My<span>Plan</span>Maker</div>
    <button class="proj" id="apri-progetti" title="Progetti">Progetto <b id="nome-progetto">—</b> <small>▾</small></button>
    <span class="stato" id="stato-salvataggio"></span>
    <div class="sp"></div>
    <button class="btn icon" id="annulla" title="Annulla (Ctrl+Z)">↶</button>
    <button class="btn icon" id="ripeti" title="Ripeti (Ctrl+Y)">↷</button>
    <button class="btn" id="apri-distinta">Distinta e tagli</button>
    <button class="btn primary" id="esporta">Esporta PDF</button>
  </header>

  <aside class="tools">
    <button class="tool" data-cmd="pannello" title="Pannello (P)"><svg viewBox="0 0 32 32"><rect x="5" y="9" width="22" height="14" rx="1.5"/></svg>Pannello</button>
    <button class="tool" data-cmd="listello" title="Listello (L)"><svg viewBox="0 0 32 32"><rect x="3" y="13" width="26" height="6" rx="1"/></svg>Listello</button>
    <button class="tool" data-cmd="modelli" title="Modelli pronti (T)"><svg viewBox="0 0 32 32"><rect x="6" y="4" width="20" height="24" rx="1.5"/><path d="M6 12h20M6 20h20"/></svg>Modelli</button>
    <button class="tool" data-cmd="cassetto" title="Cassetto tra due fianchi (K)" data-serve-sel><svg viewBox="0 0 32 32"><rect x="4" y="9" width="24" height="14" rx="1.5"/><path d="M12 16h8"/></svg>Cassetto</button>
    <hr>
    <button class="tool" data-cmd="accosta" data-serve-sel title="Accosta (C)"><svg viewBox="0 0 32 32"><rect x="4" y="9" width="9" height="14" rx="1"/><path d="M27 9v14M17 16h7M21 13l3 3-3 3"/></svg>Accosta</button>
    <button class="tool" data-cmd="adatta" data-serve-sel title="Adatta (A)"><svg viewBox="0 0 32 32"><path d="M5 24 27 10M19 9l8 1-3 7"/></svg>Adatta</button>
    <button class="tool" data-cmd="dividi" data-serve-sel title="Dividi (D)"><svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="1.5"/><path d="M5 12.3h22M5 19.6h22"/></svg>Dividi</button>
    <button class="tool" data-cmd="misura" title="Misura (M)"><svg viewBox="0 0 32 32"><path d="M4 22 22 4l6 6-18 18z"/><path d="M9 17l2 2M12 14l3 3M15 11l2 2M18 8l3 3"/></svg>Misura</button>
  </aside>

  <main>
    <div class="views" id="viste">
      <button data-vista="3d" class="on">3D</button><button data-vista="fronte">Fronte</button><button data-vista="lato">Lato</button><button data-vista="sopra">Sopra</button><button data-vista="esploso" title="Vista esplosa">Esploso</button><button data-vista="viti" title="Mostra o nascondi viti e fissaggi">Viti</button><button data-vista="inquadra" title="Inquadra tutti i pezzi">⤢</button>
    </div>
    <div id="vista3d"></div>
    <div class="barra-sel" id="barra-sel" hidden>
      <span class="conta"></span>
      <button data-cmd="sposta" title="Sposta trascinando (G)">✥ Sposta</button>
      <button data-cmd="ruota" title="Ruota trascinando (R)">⟳ Ruota</button>
      <button data-cmd="multipla" title="Aggiungi altri pezzi alla selezione (Maiusc + clic)">＋ Più pezzi</button>
      <span class="sep"></span>
      <button data-cmd="duplica" title="Duplica (Ctrl+D)">Duplica</button>
      <button data-cmd="specchia" title="Copia specchiata a destra (S)">Specchia</button>
      <button data-cmd="elimina" class="danger" title="Elimina (Canc)">Elimina</button>
    </div>
    <div class="toast" id="toast" hidden><span class="dot"></span><span id="toast-testo"></span><button id="toast-chiudi" class="link" hidden>Annulla</button></div>
  </main>

  <aside class="props" id="proprieta"></aside>

  <footer id="piede"></footer>
</div>

<dialog id="dlg-progetti" class="dlg">
  <div class="dlg-testa"><h2>Progetti</h2><button class="btn icon" data-chiudi>✕</button></div>
  <div class="dlg-corpo">
    <button class="btn primary" id="nuovo-progetto">+ Nuovo progetto vuoto</button>
    <div class="azioni"><button class="btn" id="importa">Importa da file…</button><button class="btn" id="esporta-file">Esporta questo progetto</button></div>
    <input type="file" id="file-importa" accept=".json,application/json" hidden>
    <h3>I tuoi progetti</h3>
    <ul class="lista" id="lista-progetti"></ul>
    <h3>Parti da un esempio</h3>
    <ul class="lista" id="lista-esempi"></ul>
  </div>
</dialog>

<dialog id="dlg-distinta" class="dlg larga">
  <div class="dlg-testa"><h2>Distinta e tagli</h2><div class="seg schede" id="schede-distinta"><button data-scheda="pezzi" class="on">Pezzi</button><button data-scheda="schema">Schema di taglio</button><button data-scheda="ferramenta">Viti e controlli</button></div><span class="sp"></span><button class="btn" id="stampa">Stampa o salva PDF</button><button class="btn icon" data-chiudi>✕</button></div>
  <div class="dlg-corpo" id="distinta"></div>
</dialog>

<dialog id="dlg-dividi" class="dlg">
  <div class="dlg-testa"><h2>Dividi lo spazio</h2><button class="btn icon" data-chiudi>✕</button></div>
  <div class="dlg-corpo">
    <p id="dividi-testo"></p>
    <div class="stepper"><button class="btn icon" id="dividi-meno">−</button><div class="input"><input id="dividi-n" inputmode="numeric" value="1"><small>pezzi</small></div><button class="btn icon" id="dividi-piu">+</button></div>
    <div id="dividi-esito" class="ok"></div>
    <div class="azioni"><button class="btn" data-chiudi>Annulla</button><button class="btn primary" id="dividi-ok">Aggiungi</button></div>
  </div>
</dialog>

<div id="stampa-area"></div>

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
